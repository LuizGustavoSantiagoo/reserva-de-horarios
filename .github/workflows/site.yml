name: Site do método

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # Este template é clonado por cada aluno. Sem a guarda abaixo, o repositório
    # de cada um tentaria publicar o site do método — e falharia se o Pages não
    # estiver habilitado lá. No repositório do aluno o job simplesmente não roda.
    if: github.repository == 'utfpr-gp/utf-sdd-template'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicacao
        uses: actions/deploy-pages@v4
